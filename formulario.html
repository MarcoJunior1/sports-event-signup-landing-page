<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Inscrição</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏐 Inscrição para O VOLÊI SEM LIMITES</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="formulario.html">Inscreva-se</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Cadastro Intergaláctico</h2>
      <form action="#" method="post">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail Interplanetário:</label>
        <input type="email" id="email" name="email" required>

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria">
          <option value="jogador">Jogador</option>
          <option value="libero">Líbero</option>
          <option value="Cental">Central</option>
          <option value="Ponteiro">Ponteiro</option>
          <option value="Oposto">Oposto</option>
          <option value="Levantador">Levantador</option>
          <option value="Iniciante">Iniciante</option>
        </select>

        <label for="mensagem">Mensagem (opcional):</label>
        <textarea id="mensagem" name="mensagem" rows="4"></textarea>

        <button type="submit" class="btn">Enviar para a o Volêi Sem Limites</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2080 Vôlei Futurístico</p>
  </footer>
</body>
</html>
